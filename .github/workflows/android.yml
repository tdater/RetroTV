name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RETROTV_KEYSTORE_BASE64: ${{ secrets.RETROTV_KEYSTORE_BASE64 }}
      RETROTV_KEYSTORE_PASSWORD: ${{ secrets.RETROTV_KEYSTORE_PASSWORD }}
      RETROTV_KEY_ALIAS: ${{ secrets.RETROTV_KEY_ALIAS }}
      RETROTV_KEY_PASSWORD: ${{ secrets.RETROTV_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes list the commits since the previous tag

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests, lint and debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Signed release, when the signing secrets are configured.
      - name: Signed release APK
        if: env.RETROTV_KEYSTORE_BASE64 != ''
        run: |
          echo "$RETROTV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/retrotv.jks"
          RETROTV_KEYSTORE="$RUNNER_TEMP/retrotv.jks" ./gradlew assembleRelease

      # Tags (v1.0) publish the signed APK to the public downloads-only repository (and its
      # features page). Needs a RELEASES_TOKEN secret allowed to write its releases.
      - name: Prepare release
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        run: |
          cp app/build/outputs/apk/release/app-release.apk "RetroTV-$GITHUB_REF_NAME.apk"
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "RetroTV $GITHUB_REF_NAME"
            echo
            echo "Download the APK below and install it on the TV (see https://tdater.github.io/RetroTV-releases/#install)."
            echo
            echo "Changes:"
            git log --no-merges --pretty='- %s' ${previous:+$previous..}"$GITHUB_REF_NAME" | head -40
          } > release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        uses: softprops/action-gh-release@v3
        with:
          repository: tdater/RetroTV-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          name: RetroTV ${{ github.ref_name }}
          body_path: release-notes.md
          files: RetroTV-${{ github.ref_name }}.apk
